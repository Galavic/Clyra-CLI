name: Verify CLI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.1.0-beta.39

permissions:
  # Draft release assets require push access, even for downloading them.
  contents: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download and run the native CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          arch=x64
          if [ "$RUNNER_ARCH" = "ARM64" ]; then arch=arm64; fi
          case "$RUNNER_OS" in
            Windows) platform=windows; extension=zip; binary=clyra.exe ;;
            macOS) platform=darwin; extension=tar.gz; binary=clyra ;;
            Linux) platform=linux; extension=tar.gz; binary=clyra ;;
          esac
          asset="clyra-${platform}-${arch}.${extension}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir artifacts
          mkdir smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell.exe -NoProfile -Command "Expand-Archive -LiteralPath 'artifacts/$asset' -DestinationPath smoke"
          else
            tar -xf "artifacts/$asset" -C smoke
          fi
          if [ "$RUNNER_OS" != "Windows" ]; then test -x "smoke/$binary"; fi
          version=$("./smoke/$binary" --version | tr -d '\r')
          test "$version" = "${TAG#v}"
          "./smoke/$binary" --help > cli-help.txt 2>&1
          grep -q login cli-help.txt
          grep -q logout cli-help.txt
          echo "Verified $platform/$arch: $version"
