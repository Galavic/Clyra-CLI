name: Publish npm launcher

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install -g npm@11
      - name: Publish launcher package
        working-directory: npm/clyra-cli
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "clyra-cli@$VER" version >/dev/null 2>&1; then
            echo "clyra-cli@$VER already on registry, skipping publish"
          else
            npm publish --access public --tag beta
          fi
      - name: Tag release as latest
        working-directory: npm/clyra-cli
        run: |
          unset NODE_AUTH_TOKEN
          npm dist-tag add clyra-cli@$(node -p "require('./package.json').version") latest
