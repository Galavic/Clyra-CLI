name: Publish npm launcher

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install -g npm@11
      - name: Sync package version from release tag
        # En releases, la versión la manda el tag (vX.Y.Z): se escribe solo
        # en el workspace del runner, sin tocar el repo. Así nunca hay que
        # subir la versión a mano para publicar en npm.
        if: github.event_name == 'release'
        working-directory: npm/clyra-cli
        env:
          VER: ${{ github.event.release.tag_name }}
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));j.version=String(process.env.VER||'').replace(/^v/,'');fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n')"
          node -p "require('./package.json').version"
      - name: Publish launcher package
        # Sin --tag: npm pone latest automáticamente al publicar (vía OIDC,
        # sin logins ni tokens). El tag beta se intenta mover aparte.
        working-directory: npm/clyra-cli
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "clyra-cli@$VER" version >/dev/null 2>&1; then
            echo "clyra-cli@$VER already on registry, skipping publish"
          else
            npm publish --access public
          fi
      - name: Sync npm tags
        # Mueve latest y beta con el secret NPM_TOKEN (token clásico
        # Automation de npmjs, se crea una sola vez). Sin secret se omite.
        continue-on-error: true
        working-directory: npm/clyra-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN ausente, se omite"; exit 0; fi
          VER=$(node -p "require('./package.json').version")
          npm dist-tag add "clyra-cli@$VER" latest
          npm dist-tag add "clyra-cli@$VER" beta
